[package]
name = "tomato-buddy"
version = "0.1.0"
description = "A pixel cat pomodoro desktop companion"
authors = ["TomatoBuddy"]
edition = "2021"

[lib]
name = "tomato_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
